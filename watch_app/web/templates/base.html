<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Watch App{% endblock %}</title>

  <!-- Tailwind via CDN — fine for a local tool; would switch to compiled CSS
       if this were ever deployed. -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- HTMX for declarative partial swaps. -->
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>

  <style>
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-feature-settings: "cv11", "ss01", "ss03";
    }
    /* Tabular numerals for score/rank/mention columns — crucial for clean
       alignment in tables. */
    .tabular { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen antialiased">
  <header class="border-b border-stone-200 bg-white/80 backdrop-blur sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-baseline justify-between">
      <a href="/" class="text-xl font-semibold tracking-tight hover:text-stone-600 transition">
        Watch App
      </a>
      <div class="flex items-baseline gap-6">
        <a href="/movers" class="text-xs text-stone-500 hover:text-stone-900 transition uppercase tracking-[0.1em] font-medium">
          Movers
        </a>
        <a href="/comparison" class="text-xs text-stone-500 hover:text-stone-900 transition uppercase tracking-[0.1em] font-medium">
          Comparison
        </a>
        <a href="/methodology" class="text-xs text-stone-500 hover:text-stone-900 transition uppercase tracking-[0.1em] font-medium">
          Methodology
        </a>
        <span class="text-[11px] text-stone-500 uppercase tracking-[0.15em] font-medium">
          Independent Watchmaker Discovery
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-10">
    {% block content %}{% endblock %}
  </main>

  <footer class="max-w-5xl mx-auto px-6 py-10 text-xs text-stone-400 border-t border-stone-100 mt-16">
    Scored daily from watch media (SJX, Monochrome, Fratello, Hodinkee, Quill&nbsp;&amp;&nbsp;Pad) and GPHG nominations (2023&ndash;2025).
  </footer>
</body>
</html>

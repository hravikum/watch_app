<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Watch App{% endblock %}</title>

  <!-- Tailwind via CDN for Phase 0. In Phase 2 we'll switch to compiled CSS. -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- HTMX for declarative partial swaps. -->
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>

  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen">
  <header class="border-b border-stone-200 bg-white">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-baseline justify-between">
      <a href="/" class="text-xl font-semibold tracking-tight">
        Watch App
      </a>
      <span class="text-xs text-stone-500 uppercase tracking-widest">
        Independent Watchmaker Discovery
      </span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="max-w-5xl mx-auto px-6 py-8 text-xs text-stone-400">
    Phase 0 — dummy data only.
  </footer>
</body>
</html>

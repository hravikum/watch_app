# Curated seed list of independent watchmakers.
#
# These are loaded into the Makers table on every scan (idempotent upsert).
# They also form the vocabulary used by the rule-based entity extractor.
#
# Sources:
# - Louis Vuitton Watch Prize for Independent Creatives (editions 1 & 2)
# - GPHG nominees and winners — recent independents
# - The AHCI (Académie Horlogère des Créateurs Indépendants) roster
# - Well-recognized indie maisons with a presence in SJX / Monochrome / Hodinkee coverage
#
# Adding a maker here:
#   - canonical_name: the name we prefer to display. Use the maker's own
#     preferred spelling, including diacritics.
#   - aliases: alternate spellings the extractor should also recognize.
#     Include a diacritic-stripped version only if it differs enough to
#     not be caught by our normalization (usually not needed).
#   - country: ISO country name (used for filtering later).
#   - founded_year: when the atelier started operating (may be approximate).
#   - is_independent: defaults to true. Set to false for large conglomerate-
#     owned houses included here as context for the extractor.

